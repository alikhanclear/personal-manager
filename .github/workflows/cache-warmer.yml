name: Daily Cache Warmer

# Run daily at 9:30 AM UTC (after AWS materialized view refreshes at 9:00 AM)
on:
  schedule:
    - cron: '30 9 * * *'  # 9:30 AM UTC daily
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger data refresh
        run: |
          echo "Triggering cache refresh at $(date)"

          # Call the /refresh endpoint
          RESPONSE=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.REFRESH_TOKEN }}" \
            -w "\nHTTP_CODE:%{http_code}" \
            https://casualhero-bi.fly.dev/refresh)

          # Extract HTTP code
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          # Check if successful
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Cache refresh successful!"
          else
            echo "❌ Cache refresh failed with code $HTTP_CODE"
            exit 1
          fi
