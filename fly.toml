# Fly.io Deployment Configuration for CasualHero BI Platform
# App: casualhero-bi

app = "casualhero-bi"
primary_region = "lhr"  # London region (closest to AWS RDS eu-west-2)

[build]
  dockerfile = "Dockerfile"

[env]
  # Environment variables (non-sensitive)
  PYTHONUNBUFFERED = "1"

# Secrets (set via: fly secrets set KEY=value)
# - DATABASE_URL: PostgreSQL connection string
# - Other sensitive config

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep always-on (no auto-sleep)
  auto_start_machines = true
  min_machines_running = 1    # Always have 1 instance running

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# VM Resources
[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "8gb"  # 8GB RAM for 5 years of data (~1.66M rows)

# Deployment commands:
#
# Initial setup:
#   fly launch
#   fly secrets set DATABASE_URL="postgresql://..."
#
# Deploy updates:
#   fly deploy
#
# View logs:
#   fly logs
#
# SSH into instance:
#   fly ssh console
#
# Check cron status:
#   fly status
#   fly logs --app casualhero-bi
