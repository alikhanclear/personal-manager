<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasualHero BI - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .logo-subtitle {
            font-size: 18px;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 48px;
        }

        .loading-text {
            font-size: 16px;
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .progress-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 24px;
        }

        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            width: 0%;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 14px;
            opacity: 0.7;
            font-weight: 500;
        }

        .error-message {
            display: none;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 16px 24px;
            border-radius: 8px;
            margin-top: 24px;
            max-width: 400px;
        }

        .error-message.show {
            display: block;
        }

        /* Smooth fade out when transitioning */
        body.fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">Snowflake Gelato</div>
        <div class="logo-subtitle">BI Platform</div>

        <div class="spinner"></div>

        <div class="loading-text">Loading your dashboard</div>

        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status-text" id="status">Initializing data...</div>

        <div class="error-message" id="error">
            <strong>Taking longer than expected</strong><br>
            The system is loading historical data. This can take up to 2 minutes on first load.
        </div>
    </div>

    <script>
        // Configuration
        const HEALTH_CHECK_URL = '/health';
        const MAIN_APP_URL = '/';
        const CHECK_INTERVAL = 2000; // Check every 2 seconds
        const TIMEOUT = 120000; // Show error after 2 minutes

        let startTime = Date.now();
        let checkCount = 0;

        // Status messages that cycle
        const statusMessages = [
            'Initializing data...',
            'Loading transaction history...',
            'Preparing analytics...',
            'Almost ready...'
        ];

        function updateStatus() {
            checkCount++;
            const messageIndex = Math.floor(checkCount / 3) % statusMessages.length;
            document.getElementById('status').textContent = statusMessages[messageIndex];
        }

        function checkHealth() {
            fetch(HEALTH_CHECK_URL)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else if (response.status === 503) {
                        // Still loading
                        throw new Error('loading');
                    } else {
                        throw new Error('error');
                    }
                })
                .then(data => {
                    // Data loaded! Transition to main app
                    document.getElementById('status').textContent = 'Ready! Redirecting...';

                    // Smooth fade out
                    setTimeout(() => {
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = MAIN_APP_URL;
                        }, 400);
                    }, 300);
                })
                .catch(error => {
                    // Still loading or error
                    const elapsed = Date.now() - startTime;

                    if (elapsed > TIMEOUT) {
                        // Show "taking longer than expected" message
                        document.getElementById('error').classList.add('show');
                    }

                    // Update status message
                    updateStatus();

                    // Check again
                    setTimeout(checkHealth, CHECK_INTERVAL);
                });
        }

        // Start checking immediately
        checkHealth();
    </script>
</body>
</html>
